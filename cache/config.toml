[database]
database_type = 'postgres'
database_file_location = 'out.sqlite'
user = 'postgres'
password = 'postgres'
host = 'localhost'
port = 5432
database_name = 'iglu'

[logger]
logging_format = 'pretty'
logging_prefix = 'cache'
logging_prefix_color = 'magenta'
log_level = 'debug'
should_log_requests = true 

[server]
hostname = 'http://127.0.0.1:8080' #Set this to your hostname
interface = '127.0.0.1' # Interface on which the cache is listening
port = 8080 # Port on which the server is listening
enable_rest = true
enable_info = true 
use_reverse_proxy = false
trusted_proxies = ["10.0.0.1"]

[storage]
storage_type = 'fs' #Either s3 or fs
binary_storage_directory = '/tmp/iglu' #This may be an existing or not existing path 
[storage.s3]
access_key_id = "iglu"
secret_access_key = "iglu_dev_pw" 
bucket = "iglu"
endpoint = "http://localhost:9000"

#[config]
#[config.reconcile]
#mode = 'authorative'

# Define your tenants here, or if you wish to use either the CLI or the Controller set this variable to true:
# CAREFULL: Changing the key of the tenant deletes the old tenant and recreates a new one, which also deletes all derivation <-> tenant links this tenant might have stored
[tenants]
[tenants.boerg]
github_username = 'iglu-sh' #Set to your Github Username, as far as we can tell this field is largely unused
is_public = true #True adds an allow rule with CIDR 0.0.0.0/0 and priority 100 to your cache, setting to false does the opposite. You can change this later.
preferred_compression_method = 'xz' #May either be xz or zstd
priority = 1 #Sets the priority of this nix cache, this affects which cache gets asked first for a cache hit during nix build processes
ttl = '5w'
signing_method = 'server'

[api_keys]
[api_keys.boerg]
name = 'boerg key'
generated = true
tenant = 'boerg'

[public_keys]
[public_keys.boerg]
name = 'boerg key'
key = 'Z6AmDHNNlfVqV3IUDmhAKQL5wF7cADPROuLYUam+5Nk='
linked_api_key = 'boerg'

[keypairs]
[keypairs.boerg]
tenant = "boerg"
