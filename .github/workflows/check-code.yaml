---
name: "Check Code"
permissions:
    contents: read
on:
    pull_request:
jobs:
    check-code:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5
            - uses: cachix/install-nix-action@v31
              with:
                  nix_path: nixpkgs=channel:nixos-unstable
            - run: nix develop -c pre-commit run --all-files
