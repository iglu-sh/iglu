name: Publish @iglu-sh/shared

on:
  release:
    types: [created]
  workflow_dispatch:

jobs:
  publish-gpr:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2 
        with:
          registries: |
            https://registry.npmjs.org/
            @iglu-sh:https://npm.pkg.github.com/|${{secrets.NPM_REGISTRY_GITHUB_TOKEN}}
      - run: bun ci --ignore-scripts
      - run: cd shared && bun publish
        env:
          NODE_AUTH_TOKEN: ${{secrets.NPM_REGISTRY_GITHUB_TOKEN}}
      - uses: oven-sh/setup-bun@v2 
        with:
          registry-url: https://registry.npmjs.org
          scope: "@iglu-sh"
      - run: cd shared && bun publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_REGISTRY_TOKEN }}
