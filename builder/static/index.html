<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iglu Builder</title>
    <script src=index.js></script>
    <link rel="stylesheet" href=index.css />
</head>

<body onload="onload()">
    <h1>Iglu Builder</h1>
    <p>This is the REST-API of the Iglu Builder</p>
    <p>More details could be found <a href="https://github.com/iglu-sh/iglu">here</a></p>
    <p>The REST-API documentation is <a href="/docs">here</a></p>
    <br>
    <br>
    <br>


    <div>
        <h2>Testing:</h2>
        <form id="form">
            <label for="command">Command: </label>
            <input id="command" name="command" type="text" required>

            <label for="cwd">Working directory: </label>
            <input type="text" name="cwd" id="cwd" value="/tmp/iglu_builder">

            <label for="clone">Clone?:</label>
            <input type="checkbox" name="clone" id="clone">

            <label for="url">Repo URL:</label>
            <input type="text" id="url" name="url">

            <label for="branch">Repo branch:</label>
            <input type="text" id="branch" name="branch">

            <button id="connect" type="button">connect</button>
            <button id="build" type="button">build</button>

            <div>Websocket status:</div>
            <div id="status"></div>
        </form>
        <div id="output"></div>
    </div>
</body>

</html>
